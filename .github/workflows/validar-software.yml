name: Validar firmware y herramientas

on:
  push:
    branches: [main, documentacion-final-tres-colores]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar la sintaxis
        run: |
          python -m py_compile software/dashboard/lector_serial.py software/dashboard/panel.py testing/analizar_datos.py
      - name: Pruebas automáticas de lógica (no son mediciones reales)
        run: python -m unittest discover -s testing -p "test_*.py" -v
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar core AVR y compilar para Leonardo
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:leonardo firmware/detector_humedad
