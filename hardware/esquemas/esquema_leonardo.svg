<text x="65" y="198" font-size="24" font-weight="bold">Sensor capacitivo</text><text x="65" y="226" font-size="17">Salida analógica: A0</text><text x="65" y="256" font-size="17">Alimentación: VCC</text><text x="65" y="286" font-size="17">Tierra: GND</text>
<text x="440" y="177" font-size="27" font-weight="bold">Arduino Leonardo</text><text x="440" y="210" font-size="18">A0: lectura de humedad</text><text x="440" y="246" font-size="18">D9 PWM: rojo</text><text x="440" y="275" font-size="18">D10 PWM: verde</text><text x="440" y="304" font-size="18">D11 PWM: azul</text><text x="440" y="340" font-size="18">USB serial: 9600 baud</text>
<text x="878" y="210" font-size="25" font-weight="bold">LED RGB</text><text x="878" y="245" font-size="18">Rojo → D9</text><text x="878" y="274" font-size="18">Verde → D10</text><text x="878" y="303" font-size="18">Azul → D11</text><text x="878" y="335" font-size="15">Común y resistencias: verificar</text>
<text x="442" y="505" font-size="24" font-weight="bold">Computador conectado por USB</text><text x="442" y="535" font-size="18">pyserial → CSV → dashboard local</text><text x="442" y="565" font-size="17">Registro histórico con fecha y hora</text>
</g>
