<g font-family="Arial,sans-serif" fill="#18352b">
<text x="46" y="55" font-weight="bold" font-size="29">Esquema funcional — detector de humedad Leonardo</text>
<text x="46" y="87" font-size="17">Versión sin protoboard. Esquema a contrastar con el cableado real antes de energizar.</text>
</g>
<g stroke-width="3" stroke="#487b65" fill="#e7f5ed"><rect x="43" y="160" width="268" height="194" rx="17"/><rect x="412" y="135" width="335" height="254" rx="17"/><rect x="857" y="170" width="257" height="183" rx="17"/><rect x="413" y="463" width="334" height="139" rx="17"/></g>
